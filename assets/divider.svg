<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8a0014"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="18" width="1000" height="4" fill="url(#bar)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <!-- haki pulse from center -->
  <ellipse cx="500" cy="20" rx="20" ry="3" fill="#ff1030" opacity="0.8" filter="url(#g)">
    <animate attributeName="rx" values="20;480;20" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.05;0.9" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- crackling lightning -->
  <g fill="none" stroke-linejoin="miter" filter="url(#g)">
    <polyline points="0,20 90,20 104,6 118,32 140,12 160,26 190,20 330,20 344,8 360,30 378,14 396,24 420,20 580,20 596,6 612,32 630,10 650,26 676,20 820,20 836,8 850,30 870,12 888,24 910,20 1000,20" stroke="#ff1030" stroke-width="2.5">
      <animate attributeName="opacity" values="0;1;0;0.9;0;0;0" keyTimes="0;0.05;0.1;0.15;0.25;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="0,20 90,20 104,6 118,32 140,12 160,26 190,20 330,20 344,8 360,30 378,14 396,24 420,20 580,20 596,6 612,32 630,10 650,26 676,20 820,20 836,8 850,30 870,12 888,24 910,20 1000,20" stroke="#fff" stroke-width="0.8">
      <animate attributeName="opacity" values="0;1;0;0.9;0;0;0" keyTimes="0;0.05;0.1;0.15;0.25;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </polyline>
    <polyline points="0,20 200,20 214,32 230,8 250,28 270,14 292,20 700,20 716,10 732,30 752,12 770,26 792,20 1000,20" stroke="#c0001e" stroke-width="2">
      <animate attributeName="opacity" values="0;0;0;1;0;0.8;0;0" keyTimes="0;0.4;0.5;0.55;0.6;0.65;0.72;1" dur="2.4s" repeatCount="indefinite"/>
    </polyline>
  </g>
  <!-- traveling spark -->
  <circle cy="20" r="3" fill="#fff" filter="url(#g)">
    <animate attributeName="cx" values="0;1000" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
