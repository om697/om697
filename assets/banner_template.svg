<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.8" cy="0.5" r="0.9">
      <stop offset="0%" stop-color="#3a0008"/>
      <stop offset="55%" stop-color="#0d0207"/>
      <stop offset="100%" stop-color="#020005"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff2040" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8a0014" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffb3bd"/>
      <stop offset="100%" stop-color="#ff1d3d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
        <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.25" stop-color="#000"/><stop offset="0.7" stop-color="#fff"/>
    </linearGradient>
    <mask id="gifMask"><rect width="1000" height="260" fill="url(#fadeL)"/></mask>
    <clipPath id="card"><rect width="1000" height="260" rx="18"/></clipPath>
    <filter id="shake"><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" result="t"><animate attributeName="baseFrequency" values="0.02;0.035;0.02" dur="0.6s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="t" scale="3"/></filter>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <!--GIF_LAYER-->
  <g clip-path="url(#card)" mask="url(#gifMask)">
    {{GIF}}
  </g>
  <rect width="1000" height="260" rx="18" fill="#05010a" opacity="0.35"/>

  <!-- kanji watermark: 覇王色 -->
  <text x="610" y="190" font-size="150" font-family="'Yu Mincho','MS Mincho','Noto Serif CJK JP',serif" fill="#ff1030" opacity="0.07" font-weight="900">覇王色</text>

  <!-- speed lines (anime) -->
  <g stroke="#ff4058" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
    <line x1="1000" y1="30" x2="700" y2="30"><animate attributeName="x1" values="1000;800;1000" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="1000" y1="80" x2="620" y2="80"><animate attributeName="x1" values="1000;760;1000" dur="1.7s" repeatCount="indefinite"/></line>
    <line x1="1000" y1="190" x2="660" y2="190"><animate attributeName="x1" values="1000;780;1000" dur="1.4s" repeatCount="indefinite"/></line>
    <line x1="1000" y1="230" x2="740" y2="230"><animate attributeName="x1" values="1000;850;1000" dur="1s" repeatCount="indefinite"/></line>
  </g>

  <!-- pulsing haki aura -->
  <circle cx="830" cy="130" r="130" fill="url(#aura)">
    <animate attributeName="r" values="100;165;100" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- expanding shockwave rings -->
  <g fill="none" stroke="#ff1d3d" stroke-width="3">
    <circle cx="830" cy="130" r="10"><animate attributeName="r" values="10;260" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.6s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="5;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="130" r="10"><animate attributeName="r" values="10;260" dur="2.6s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="5;0.5" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- red-black lightning bolts (flicker) -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="round" filter="url(#glow)">
    <g>
      <polyline points="900,0 868,48 888,52 846,112 870,116 820,190 842,194 800,260" stroke="#ff1030" stroke-width="3.5"/>
      <polyline points="900,0 868,48 888,52 846,112 870,116 820,190 842,194 800,260" stroke="#fff" stroke-width="1" opacity="0.8"/>
      <polyline points="846,112 818,128 826,150" stroke="#ff1030" stroke-width="2"/>
      <animate attributeName="opacity" values="0;1;0;0.9;0;0;0" keyTimes="0;0.04;0.08;0.12;0.2;0.6;1" dur="2.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <polyline points="720,0 748,44 728,50 770,100 748,108 786,170 766,176 790,260" stroke="#c0001e" stroke-width="3"/>
      <polyline points="720,0 748,44 728,50 770,100 748,108 786,170 766,176 790,260" stroke="#ffd0d6" stroke-width="1" opacity="0.7"/>
      <animate attributeName="opacity" values="0;0;1;0;0.8;0;0" keyTimes="0;0.3;0.34;0.38;0.42;0.5;1" dur="2.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <polyline points="1000,60 940,96 958,104 900,150 922,158 880,214" stroke="#ff2a48" stroke-width="2.5"/>
      <animate attributeName="opacity" values="0;0;0;1;0;0.8;0;0" keyTimes="0;0.55;0.6;0.64;0.68;0.72;0.78;1" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- black lightning (contrast) -->
  <g fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <polyline points="640,0 668,60 648,66 690,130 668,138 700,200 682,206 704,260">
      <animate attributeName="opacity" values="0;1;0;0.8;0;0" keyTimes="0;0.7;0.74;0.78;0.84;1" dur="2.6s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- embers rising -->
  <g fill="#ff3a55">
    <circle cx="560" cy="250" r="2"><animate attributeName="cy" values="260;-10" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="250" r="1.5"><animate attributeName="cy" values="260;-10" dur="4.2s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="250" r="2.5"><animate attributeName="cy" values="260;-10" dur="5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="250" r="2"><animate attributeName="cy" values="260;-10" dur="4.6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="250" r="1.5"><animate attributeName="cy" values="260;-10" dur="3.9s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.9s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <g font-family="Impact,'Arial Black',Segoe UI,sans-serif">
    <text x="64" y="132" font-size="72" font-weight="900" fill="#000" opacity="0.6" transform="translate(4 4)">OM ACHYUTH</text>
    <text x="60" y="128" font-size="72" font-weight="900" fill="url(#title)" stroke="#000" stroke-width="1.5" filter="url(#glow)">OM ACHYUTH
      <animate attributeName="opacity" values="1;0.85;1;0.95;1" dur="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="172" font-size="20" fill="#fff" opacity="0.92" letter-spacing="3">4TH YEAR AIML · BUILDER · CLOUD + PYTHON</text>
    <text x="64" y="206" font-size="15" fill="#ff4058" letter-spacing="2">覇王色の覇気 — DhanDrishti · MedTrack · MindCare</text>
  </g>

  <!-- red edge pulse -->
  <rect x="1" y="1" width="998" height="258" rx="18" fill="none" stroke="#ff1030" stroke-width="2">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
